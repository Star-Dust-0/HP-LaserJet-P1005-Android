name: Build APK from source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK (default debug signing, no keystore in repo)
        run: gradle assembleDebug
      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex' || { echo 'classes.dex missing'; exit 1; }
          unzip -l "$APK" | grep -q 'AndroidManifest.xml' || { echo 'manifest missing'; exit 1; }
          ls -la "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: hp-p1005-source-built-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Restore Morphe signing keystore
        env:
          KS: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "MORPHE_KEYSTORE_BASE64 secret missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/morphe.p12"
      - name: Build signed release APK (Morphe keystore)
        env:
          MORPHE_KEYSTORE_FILE: ${{ runner.temp }}/morphe.p12
          MORPHE_STORE_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
          MORPHE_KEY_ALIAS: morphe
          MORPHE_KEY_PASSWORD: ${{ secrets.MORPHE_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify Morphe signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer-certs.txt
          grep -qi '0a8b609561f299eaba4518c57e558d506e3991bd0ac551cc167716241adad55f' signer-certs.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hp-p1005-source-built-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
