name: Build APK from source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: gradle testDebugUnitTest
      - name: Build debug APK (default debug signing, no keystore in repo)
        run: gradle assembleDebug
      - name: Verify APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex' || { echo 'classes.dex missing'; exit 1; }
          unzip -l "$APK" | grep -q 'AndroidManifest.xml' || { echo 'manifest missing'; exit 1; }
          ls -la "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: hp-p1005-source-built-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
