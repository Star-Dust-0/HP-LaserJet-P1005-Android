name: UI Smoke Screenshots

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'full = UI regression; gate = print-service; printflow = in-app print transitions'
        required: false
        default: 'full'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: phone, profile: pixel_6, api-level: 34 }
          - { name: tablet, profile: pixel_tablet, api-level: 34 }
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build share-sender fixture APK
        run: gradle --no-daemon :sharesender:assembleDebug

      - name: Download matching debug APK artifact (same ref + SHA)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 40); do
            run_id=$(gh run list --repo "${{ github.repository }}" --workflow "Android APK Build" --branch "${{ github.ref_name }}" --commit "${{ github.sha }}" --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')
            [ -n "$run_id" ] && break
            sleep 15
          done
          [ -n "$run_id" ] || { echo "No successful build artifact for ${{ github.sha }}"; exit 1; }
          echo "Using build run: $run_id"
          gh run download "$run_id" --repo "${{ github.repository }}" --name hp-p1005-android-debug-apk --dir apk
          ls -la apk

      - name: Install imagemagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Enable KVM if hardware supports it
        run: |
          echo "cpu flags: $(egrep -c '(vmx|svm)' /proc/cpuinfo || true) cores with vmx/svm"
          ls -l /dev/kvm || echo "no /dev/kvm node"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm || true
          ls -l /dev/kvm || echo "still no /dev/kvm"

      - name: Run emulator and capture UI screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: true
          emulator-boot-timeout: 1500
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/run-smoke-suite.sh apk/app-debug.apk ${{ matrix.name }} "${{ inputs.suite || 'printflow' }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ matrix.name }}
          path: shots/
          if-no-files-found: error

